services:
  bot:
    # Build locally or use pre-built image from GHCR:
    # image: ghcr.io/driversti/ytdlp-telegram:latest
    build: .
    container_name: ytdlp-telegram-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./downloads:/downloads
    network_mode: host  # For Ollama and PO Token server on localhost
    depends_on:
      - pot-server
      - file-server

  file-server:
    # Build locally or use pre-built image from GHCR:
    # image: ghcr.io/driversti/ytdlp-file-server:latest
    build: ./file-server
    container_name: ytdlp-file-server
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./downloads:/downloads
    ports:
      - "8080:8080"

  pot-server:
    build: ./pot-server
    container_name: ytdlp-pot-server
    restart: unless-stopped
    init: true
    ports:
      - "4416:4416"
